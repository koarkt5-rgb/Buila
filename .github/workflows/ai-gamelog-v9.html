<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI GAMELOG — Чёрный рассвет</title>
<style>
:root{--ink:#e9e6df;--amber:#f0a81c;--red:#e0382d;--steel:#14181a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05080b;color:var(--ink);font-family:Bahnschrift,"Arial Narrow","Roboto Condensed",system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0}
#game{display:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(var(--st) + 10px) calc(var(--sr) + 16px) 0 calc(var(--sl) + 16px)}
#top{display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 6px #000}
#top>div{flex:1}
#top small{font-size:12px;opacity:.7;letter-spacing:.08em}
#hpw{width:150px;height:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);margin-top:4px}
#hpb{height:100%;width:100%;background:#7fc24a}
#obj{text-align:center}
#ot{font-size:20px;font-weight:700;color:var(--amber);line-height:1.1}
#od{font-size:14px;opacity:.85;margin-top:3px}
#ar{display:inline-block;color:var(--amber);font-size:16px;margin-right:6px}
#tr{text-align:right}
#tr b{display:block;font-size:30px;line-height:1}
#tr.hot b{color:var(--red)}
#pb{position:fixed;right:calc(var(--sr) + 16px);top:calc(var(--st) + 66px);width:40px;height:40px;border-radius:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);font-size:16px;font-weight:700}
#sub{position:fixed;left:50%;top:calc(var(--st) + 76px);transform:translateX(-50%);max-width:66vw;padding:6px 12px;background:rgba(0,0,0,.55);font-size:16px;line-height:1.25;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;border-left:3px solid var(--amber)}
#sub b{color:var(--amber);margin-right:6px}
#pgw{position:fixed;left:50%;top:60%;width:230px;margin-left:-115px;text-align:center;font-size:14px;display:none;text-shadow:0 1px 4px #000;pointer-events:none}
#pgt{height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);margin-top:4px}
#pgb{height:100%;width:0;background:var(--amber)}
#cross{position:fixed;left:50%;top:50%;pointer-events:none}
#cross i{position:absolute;background:#fff;box-shadow:0 0 3px #000;width:2px;height:9px;left:-1px;top:-17px}
#cross i:nth-child(2){top:8px}#cross i:nth-child(3){width:9px;height:2px;left:-17px;top:-1px}#cross i:nth-child(4){width:9px;height:2px;left:8px;top:-1px}
#hm{position:absolute;left:-14px;top:-14px;width:28px;height:28px;opacity:0}
#hm:before,#hm:after{content:"";position:absolute;left:13px;top:-4px;width:2px;height:36px;background:linear-gradient(var(--hc,#fff) 30%,transparent 30% 70%,var(--hc,#fff) 70%);transform:rotate(45deg)}
#hm:after{transform:rotate(-45deg)}
#hm.on{animation:hm .2s ease-out}
@keyframes hm{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.25)}}
#pop{position:fixed;left:50%;top:calc(50% - 50px);font-size:26px;font-weight:700;color:var(--amber);text-shadow:0 1px 4px #000;opacity:0;pointer-events:none;white-space:nowrap}
#pop.on{animation:pu .8s ease-out}
@keyframes pu{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
#ammo{position:fixed;left:50%;bottom:calc(var(--sb) + 12px);transform:translateX(-50%);text-align:center;text-shadow:0 1px 6px #000;white-space:nowrap;pointer-events:none}
#ammo b{font-size:38px;line-height:1}#ammo span{opacity:.6;margin-left:6px;font-size:18px}
#rl{display:none;color:var(--amber);font-size:15px}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65)),linear-gradient(rgba(20,50,90,.12),rgba(0,0,0,.05))}
#dm{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(210,0,0,.85));opacity:0}
#wf{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:5}
#stick{position:fixed;left:calc(var(--sl) + 26px);bottom:calc(var(--sb) + 26px);width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);display:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35)}
#fire{position:fixed;right:calc(var(--sr) + 26px);bottom:calc(var(--sb) + 26px);width:104px;height:104px;border-radius:50%;background:rgba(224,56,45,.55);border:3px solid rgba(255,255,255,.55);font-size:20px;font-weight:700;display:none}
#fire.on{background:rgba(224,56,45,.95)}
#reload{position:fixed;right:calc(var(--sr) + 142px);bottom:calc(var(--sb) + 36px);width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);font-size:14px;display:none}
.touch #stick,.touch #fire,.touch #reload{display:block}

/* карточка миссии */
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%)}
#card.on{display:flex;animation:cd 3.6s ease forwards}
@keyframes cd{0%{opacity:0}14%{opacity:1}78%{opacity:1}100%{opacity:0}}
#card small{display:block;font-size:15px;letter-spacing:.3em;color:var(--amber)}
#card h2{margin:6px 0;font-size:46px;letter-spacing:.04em;text-shadow:0 2px 12px #000}
#card span{font-size:15px;opacity:.75;letter-spacing:.12em}

/* боковая панель */
#panel{position:fixed;left:0;top:0;bottom:0;width:min(390px,56vw);display:none;flex-direction:column;background:linear-gradient(90deg,rgba(6,9,12,.97) 80%,rgba(6,9,12,0));padding:calc(var(--st) + 12px) 30px calc(var(--sb) + 10px) calc(var(--sl) + 22px);overflow:auto;animation:sl .45s ease-out}
#panel,#panel *{touch-action:pan-y}
@keyframes sl{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.logo{font-size:17px;font-weight:800;letter-spacing:.2em;display:flex;align-items:center}
.logo b{background:var(--amber);color:var(--steel);padding:1px 6px;margin-right:8px;letter-spacing:.05em}
#ptag{margin-top:14px;font-size:12px;letter-spacing:.3em;color:var(--amber)}
#panel h2{margin:2px 0 0;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.01em}
.bar{height:8px;margin:9px 0 10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,var(--steel) 10px 20px)}
#pinfo{font-size:14px;line-height:1.35;opacity:.88;margin-bottom:8px}
#pinfo p{margin:0 0 6px}
#pinfo .st{color:var(--amber);font-size:15px}
#mlist{margin-bottom:10px}
.ml{display:flex;gap:8px;font-size:14px;opacity:.45;margin:3px 0;letter-spacing:.04em}
.ml.ok{opacity:.8}.ml.on{opacity:1;color:var(--amber)}
.ml i{font-style:normal;width:18px}
#btns{margin-top:auto}
.pbn{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:7px;background:rgba(255,255,255,.07);border-left:4px solid rgba(255,255,255,.25);font-size:17px;font-weight:700;letter-spacing:.07em}
#b1{background:var(--amber);color:var(--steel);border-left-color:#fff}
.pbn:active{filter:brightness(1.25)}
.ver{font-size:11px;opacity:.4;letter-spacing:.15em;margin-top:2px}

.pbn.df{border-left-color:var(--amber)}
@media(max-height:430px){#panel h2{font-size:26px}#pinfo{font-size:13px}.pbn{padding:8px 12px;margin-bottom:5px;font-size:15px}.bar{margin:6px 0}}
/* заставка */
#splash{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 45%,#16222c,#05080b 70%);display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .6s}
#splash:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);animation:sc 6s linear infinite}
@keyframes sc{to{background-position:0 60px}}
.slogo{display:flex;align-items:center;justify-content:center;animation:lg 1.4s ease-out both}
.slogo b{background:var(--amber);color:var(--steel);font-size:min(16vw,92px);line-height:1;padding:.04em .18em;margin-right:.18em;font-weight:900;box-shadow:0 0 40px rgba(240,168,28,.55)}
.slogo span{font-size:min(14vw,84px);font-weight:800;letter-spacing:.16em;text-shadow:0 0 24px rgba(240,168,28,.35)}
@keyframes lg{from{opacity:0;transform:scale(1.12);letter-spacing:.5em;filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ssub{margin-top:12px;font-size:13px;letter-spacing:.5em;opacity:.55;animation:lg 1.8s ease-out both}
.sbar{width:min(300px,60vw);height:3px;background:rgba(255,255,255,.12);margin:26px auto 16px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:var(--amber);animation:ld 2.4s ease-in-out forwards}
@keyframes ld{to{width:100%}}
#stap{font-size:15px;letter-spacing:.3em;opacity:0}
#stap.rdy{animation:bl 1.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
#wn{font-size:12px;letter-spacing:.2em;opacity:.75;margin-top:2px}
.cb{position:fixed;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);font-size:11px;padding:0;display:none}
.touch .cb{display:block}.cb.on{background:rgba(240,168,28,.65)}
#kp{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);display:none;background:rgba(6,9,12,.9);border:2px solid var(--amber);padding:10px 14px;text-align:center;z-index:6;touch-action:manipulation}
#kpc{display:block;color:var(--amber);font-size:20px;letter-spacing:.2em;font-weight:700}
#kpi{font-size:30px;letter-spacing:.4em;margin:4px 0 8px;font-family:monospace}
#kpg{display:grid;grid-template-columns:repeat(3,48px);gap:5px}#kpg button{height:36px;background:rgba(255,255,255,.13);font-size:18px;font-weight:700}
#dvb{position:fixed;left:calc(var(--sl) + 6px);top:calc(var(--st) + 52px);z-index:40;padding:3px 7px;font-size:11px;letter-spacing:.1em;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);opacity:.7;touch-action:manipulation}
#dvp{position:fixed;left:calc(var(--sl) + 6px);top:calc(var(--st) + 78px);z-index:40;display:none;max-height:calc(100% - 100px);overflow:auto;background:rgba(6,9,12,.94);border:1px solid var(--amber);padding:8px;width:200px;touch-action:pan-y}
#dvp button{display:block;width:100%;text-align:left;padding:7px 8px;margin-bottom:4px;background:rgba(255,255,255,.1);font-size:13px;touch-action:manipulation}
#dvp small{display:block;color:var(--amber);letter-spacing:.2em;margin-bottom:6px;font-size:11px}
/* катсцена */
#cbT,#cbB{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:12;pointer-events:none;transition:transform 1s ease}
#cbT{top:0;transform:translateY(-100%)}#cbB{bottom:0;transform:translateY(100%)}
body.cine #cbT,body.cine #cbB{transform:none}
#cfd{position:fixed;inset:0;background:#000;opacity:0;z-index:11;pointer-events:none;transition:opacity 1.2s}
#skc{position:fixed;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 8px);z-index:14;display:none;padding:6px 12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);font-size:13px;letter-spacing:.15em;touch-action:manipulation;pointer-events:auto}
body.cine #skc{display:block}
body.cine #hud,body.cine #pb,body.cine #cross,body.cine #ammo,body.cine #stick,body.cine #reload,body.cine #fire,body.cine .cb,body.cine #pop,body.cine #pgw,body.cine #vig,body.cine #dm,body.cine #kp,body.cine #dvb,body.cine #dvp{display:none!important}
body.cine #sub{top:auto;bottom:calc(11vh + 12px);z-index:13}
</style>
</head>
<body>
<div id="game">
<div id="hud"><div id="top">
 <div><small>ЗДОРОВЬЕ</small><div id="hpw"><div id="hpb"></div></div></div>
 <div id="obj"><div id="ot">—</div><div id="od"><span id="ar">▲</span><span id="odt"></span></div></div>
 <div id="tr"><b id="trv">0</b><small id="trl">ЦЕЛИ</small></div>
</div></div>
<button id="pb">II</button>
<div id="sub"></div>
<div id="pgw"><span id="pgx">Установка заряда…</span><div id="pgt"><div id="pgb"></div></div></div>
<div id="cross"><i></i><i></i><i></i><i></i><u id="hm"></u></div>
<div id="pop"></div>
<div id="ammo"><b id="am">30</b><span id="rs">/ 120</span><div id="rl">Перезарядка…</div><div id="wn"></div></div>
<div id="vig"></div><div id="dm"></div>
<div id="stick"><div id="knob"></div></div>
<button id="reload">Заряд</button><button id="fire">Огонь</button>
<button class="cb" id="aimb" style="right:calc(var(--sr) + 26px);bottom:calc(var(--sb) + 140px)">ПРИЦЕЛ</button>
<button class="cb" id="crb" style="right:calc(var(--sr) + 92px);bottom:calc(var(--sb) + 140px)">СЕСТЬ</button>
<button class="cb" id="spb" style="left:calc(var(--sl) + 156px);bottom:calc(var(--sb) + 40px)">БЕГ</button>
<button class="cb" id="swb" style="right:calc(var(--sr) + 158px);bottom:calc(var(--sb) + 104px)">АК/М4</button>
<button class="cb" id="knb" style="right:calc(var(--sr) + 224px);bottom:calc(var(--sb) + 40px)">НОЖ</button>
<div id="kp"><small id="kpc"></small><div id="kpi">----</div><div id="kpg"></div></div>
</div>
<div id="wf"></div><button id="dvb">DEV</button><div id="dvp"></div>
<div id="cbT"></div><div id="cbB"></div><div id="cfd"></div><button id="skc">ПРОПУСТИТЬ ▶▶</button>
<div id="card"><div><small id="cs">МИССИЯ 01</small><h2 id="ch">—</h2><span id="cp"></span></div></div>
<div id="panel"><div class="logo"><b>AI</b>GAMELOG</div>
<div id="ptag">ОПЕРАЦИЯ</div><h2 id="ptitle">—</h2><div class="bar"></div>
<div id="pinfo"></div><div id="mlist"></div>
<div id="btns"><button class="pbn" id="b1"></button><button class="pbn" id="b2"></button><button class="pbn" id="b3"></button><button class="pbn" id="b4"></button></div>
<div class="ver">AI GAMELOG · КАМПАНИЯ · v2.0</div></div>
<div id="splash"><div><div class="slogo"><b>AI</b><span>GAMELOG</span></div><div class="ssub">ИГРОВАЯ СТУДИЯ</div><div class="sbar"><i></i></div><div id="stap">НАЖМИ, ЧТОБЫ НАЧАТЬ</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),R=THREE,rnd=Math.random,isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(isTouch)document.body.classList.add('touch');
const GQ=[{n:'МИНИМАЛЬНАЯ',pr:.75,sh:0,ff:.75,tm:0},{n:'СРЕДНЯЯ',pr:1,sh:1024,ff:.92,tm:1},{n:'МАКСИМАЛЬНАЯ',pr:2,sh:2048,ff:1,tm:1},{n:'УЛЬТРА',pr:3,sh:4096,ff:1.2,tm:1}],SENS=[.5,.75,1,1.4,1.9,2.5];
let gqi=isTouch?1:2,ssi=2,fogF=100;try{const a=localStorage.getItem('gl_gq'),b=localStorage.getItem('gl_ss');if(a!=null)gqi=Math.min(3,+a||0);if(b!=null)ssi=Math.min(5,+b||0)}catch(e){}
function applyG(){const g=GQ[gqi],on=g.sh>0,muAll=()=>scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)});
 rd.setPixelRatio(Math.min(devicePixelRatio||1,g.pr));rd.setSize(innerWidth,innerHeight);rd.shadowMap.enabled=on;
 moon.castShadow=on;if(on){moon.shadow.mapSize.set(g.sh,g.sh);if(moon.shadow.map){moon.shadow.map.dispose();moon.shadow.map=null}}
 rd.toneMapping=g.tm?R.ACESFilmicToneMapping:R.NoToneMapping;rd.toneMappingExposure=1.3;muAll();if(scene.fog)scene.fog.far=fogF*g.ff}
const rd=new R.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
rd.setPixelRatio(Math.min(devicePixelRatio||1,1.5));rd.setSize(innerWidth,innerHeight);document.body.prepend(rd.domElement);
const scene=new R.Scene(),cam=new R.PerspectiveCamera(72,innerWidth/innerHeight,.1,420);
cam.rotation.order='YXZ';scene.add(cam);
function fit(){cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?95:72;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)}
addEventListener('resize',fit);fit();
function setSky(c,f){const k=document.createElement('canvas');k.width=4;k.height=256;const g=k.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,c[0]);gr.addColorStop(.6,c[1]);gr.addColorStop(1,c[2]);g.fillStyle=gr;g.fillRect(0,0,4,256);
 scene.background=new R.CanvasTexture(k);fogF=f[2];scene.fog=new R.Fog(f[0],f[1],f[2]*GQ[gqi].ff)}
const hemi=new R.HemisphereLight(0x6f8fb8,0x25231f,.85);scene.add(hemi);
const moon=new R.DirectionalLight(0x9db8ff,.75);moon.position.set(-12,20,-8);scene.add(moon,moon.target);rd.shadowMap.type=R.PCFSoftShadowMap;
{const c=moon.shadow.camera;c.left=c.bottom=-32;c.right=c.top=32;c.near=1;c.far=90;c.updateProjectionMatrix();moon.shadow.bias=-.0008;moon.shadow.normalBias=.04}applyG();
const stars=(()=>{const n=320,a=new Float32Array(n*3);for(let i=0;i<n;i++){const u=rnd()*6.283,v=.12+rnd()*.88,r=90,s=Math.sqrt(1-v*v);a[i*3]=Math.cos(u)*s*r;a[i*3+1]=v*r;a[i*3+2]=Math.sin(u)*s*r}
 const g=new R.BufferGeometry();g.setAttribute('position',new R.BufferAttribute(a,3));const p=new R.Points(g,new R.PointsMaterial({size:1.6,sizeAttenuation:false,color:0xdfe8ff,fog:false}));p.frustumCulled=false;scene.add(p);return p})();

/* ---------- текстуры (рисуем кодом) ---------- */
function tex(w,draw,rep){const c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d');draw(g,w);const t=new R.CanvasTexture(c);t.wrapS=t.wrapT=R.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep[0],rep[1]);return t}
function noise(g,w,a){const d=g.getImageData(0,0,w,w),p=d.data;for(let i=0;i<p.length;i+=4){const n=(rnd()-.5)*a;p[i]+=n;p[i+1]+=n;p[i+2]+=n}g.putImageData(d,0,0)}
const concrete=rep=>tex(256,(g,w)=>{g.fillStyle='#74777a';g.fillRect(0,0,w,w);
 for(let i=0;i<260;i++){g.fillStyle=`rgba(${rnd()<.5?'0,0,0':'255,255,255'},${rnd()*.06})`;g.beginPath();g.arc(rnd()*w,rnd()*w,rnd()*26+4,0,7);g.fill()}
 for(let i=0;i<8;i++){g.strokeStyle='rgba(15,15,15,'+(.2+rnd()*.3)+')';g.lineWidth=1;g.beginPath();let x=rnd()*w,y=rnd()*w;g.moveTo(x,y);for(let k=0;k<9;k++){x+=rnd()*26-13;y+=rnd()*24-6;g.lineTo(x,y)}g.stroke()}
 for(let i=0;i<14;i++){const gr=g.createLinearGradient(0,0,0,90);gr.addColorStop(0,'rgba(30,25,20,.28)');gr.addColorStop(1,'rgba(30,25,20,0)');g.fillStyle=gr;g.save();g.translate(rnd()*w,rnd()*w*.6);g.fillRect(0,0,2+rnd()*5,90);g.restore()}
 noise(g,w,36);g.strokeStyle='rgba(20,20,20,.55)';g.lineWidth=3;g.strokeRect(0,0,w,w)},rep);
